name: luggage-showcase
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase-local
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 3s
      timeout: 3s
      retries: 20
  mqtt:
    image: andreasfrost1004/luggagetracker-showcase-mqtt:latest
    build: {context: ., dockerfile: mqtt/Dockerfile}
    restart: unless-stopped
    volumes: ["mqtt-data:/mosquitto/data"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 3s
      timeout: 4s
      retries: 20
  backend:
    image: andreasfrost1004/luggagetracker-showcase-backend:latest
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=showcase;Username=showcase;Password=showcase-local
      Mqtt__Host: mqtt
    depends_on:
      postgres: {condition: service_healthy}
      mqtt: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20
  showcase-frontend:
    image: andreasfrost1004/luggagetracker-showcase-frontend:latest
    build: ./frontend
    restart: unless-stopped
    ports: ["8081:80"]
    networks:
      default:
      ingress:
        aliases: [luggage-showcase]
    depends_on:
      backend: {condition: service_healthy}
networks:
  ingress:
    external: true
volumes:
  postgres-data:
  mqtt-data:
