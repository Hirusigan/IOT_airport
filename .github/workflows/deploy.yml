name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_dockerhub:
        description: "Check this box to publish images and update Watchtower"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: airport-simulation
            context: .
            file: airport-simulation/Dockerfile
          - name: iot-device-simulator
            context: .
            file: iot-device-simulator/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true
        uses: docker/login-action@v3
        with:
          username: andreasfrost1004
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true }}
          tags: |
            andreasfrost1004/luggagetracker-${{ matrix.name }}:latest
            andreasfrost1004/luggagetracker-${{ matrix.name }}:${{ github.sha }}

  
  trigger-watchtower:
    needs: build-and-publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true
    runs-on: ubuntu-latest
    steps:
      - name: Trigger global Watchtower update
        run: |
          curl -f -s -S -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}/v1/update"

