name: Build and publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: airport-simulation
            context: .
            file: airport-simulation/Dockerfile
          - name: iot-device-simulator
            context: .
            file: iot-device-simulator/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable ARM64 emulation on AMD64 GitHub runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: andreasfrost1004
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            andreasfrost1004/luggagetracker-${{ matrix.name }}:latest
            andreasfrost1004/luggagetracker-${{ matrix.name }}:${{ github.sha }}

  trigger-watchtower:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger global Watchtower update
        run: |
          curl -f -s -S -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}/v1/update"