name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_to_dockerhub:
        description: Publish all application images and request a Watchtower update
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: airport-simulation
            context: .
            file: airport-simulation/Dockerfile
          - name: iot-device-simulator
            context: .
            file: iot-device-simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: airport-simulation
            context: .
            file: airport-simulation/Dockerfile
          - name: iot-device-simulator
            context: .
            file: iot-device-simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: andreasfrost1004
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            andreasfrost1004/luggagetracker-${{ matrix.name }}:latest
            andreasfrost1004/luggagetracker-${{ matrix.name }}:${{ github.sha }}
      - name: Trigger Watchtower update
        env:
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_URL }}
          CONTAINER: ${{ matrix.name }}
        run: |
          curl -f -s -S \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
            "${WATCHTOWER_URL%/}/v1/update?container=${CONTAINER}"
