name: CI/CD - pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_to_dockerhub:
        description: Check this box to publish the images to Docker Hub
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: airport-simulation
            context: .
            file: airport-simulation/Dockerfile
          - name: iot-device-simulator
            context: .
            file: iot-device-simulator/Dockerfile
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: andreasfrost1004
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true && github.ref == 'refs/heads/main' }}
          tags: |
            andreasfrost1004/luggagetracker-${{ matrix.name }}:latest
            andreasfrost1004/luggagetracker-${{ matrix.name }}:${{ github.sha }}
      - name: Trigger Watchtower update
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_dockerhub == true && github.ref == 'refs/heads/main'
        env:
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_URL }}
          CONTAINER: ${{ matrix.name }}
        run: |
          curl -f -s -S \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN}" \
            "${WATCHTOWER_URL%/}/v1/update?container=${CONTAINER}"
