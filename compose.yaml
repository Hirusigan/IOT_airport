services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luggage
      POSTGRES_USER: luggage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luggage -d luggage"]
      interval: 5s
      timeout: 3s
      retries: 20
  regional:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/regional.conf"]
    configs:
      - source: regional-conf
        target: /mosquitto/config/regional.conf
      - source: regional-acl
        target: /mosquitto/config/regional.acl
    volumes: ["regional-data:/mosquitto/data"]
    networks: [airport-brokers]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  aar:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    configs:
      - source: aar-conf
        target: /mosquitto/config/mosquitto.conf
      - source: aar-acl
        target: /mosquitto/config/airport.acl
    volumes: ["aar-data:/mosquitto/data"]
    networks: [airport-brokers]
    depends_on: [regional]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  cph:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    configs:
      - source: cph-conf
        target: /mosquitto/config/mosquitto.conf
      - source: cph-acl
        target: /mosquitto/config/airport.acl
    volumes: ["cph-data:/mosquitto/data"]
    networks: [airport-brokers]
    depends_on: [regional]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
  backend:
    image: andreasfrost1004/luggagetracker-backend:latest
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=luggage;Username=luggage;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Mqtt__Host: regional
      Mqtt__Region: EU
      Rules__LoadingCutoffSeconds: 20
      Rules__GraceSeconds: 5
      Rules__StaleSeconds: 30
      AirportSimulation__Url: http://airport-simulation:8080
      Brokers__ConfigPath: /broker-config
      Docker__Endpoint: unix:///var/run/docker.sock
    volumes:
      [
        "airport-broker-config:/broker-config",
        "simulation-runs:/runs",
        "/var/run/docker.sock:/var/run/docker.sock",
      ]
    networks: [default, airport-brokers]
    depends_on:
      postgres: { condition: service_healthy }
      regional: { condition: service_healthy }
      aar: { condition: service_healthy }
      cph: { condition: service_healthy }
      airport-simulation: { condition: service_started }
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  airport-simulation:
    image: andreasfrost1004/luggagetracker-airport-simulation:latest
    restart: unless-stopped
    environment:
      BackendUrl: http://backend:8080
      DeviceSimulatorUrl: http://iot-device-simulator:8080/devices/actions
      ScenariosDirectory: /app/scenarios
    volumes: ["simulation-runs:/runs"]
    networks: [default, airport-brokers]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  iot-device-simulator:
    image: andreasfrost1004/luggagetracker-iot-device-simulator:latest
    restart: unless-stopped
    networks: [default, airport-brokers]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  frontend:
    image: andreasfrost1004/luggagetracker-frontend:latest
    restart: unless-stopped
    networks: [default, ingress]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8081:80"  

networks:
  ingress:
    external: true
  airport-brokers:
    name: airport-brokers
    internal: true
volumes:
  postgres-data:
  regional-data:
  aar-data:
  cph-data:
  simulation-runs:
  airport-broker-config:
    name: airport-broker-config

configs:
  regional-conf:
    content: |
      listener 1883 0.0.0.0
      allow_anonymous true
      acl_file /mosquitto/config/regional.acl
      persistence true
      persistence_location /mosquitto/data/
      log_dest stdout
  regional-acl:
    content: |
      topic readwrite airport/#
      topic read $$SYS/#
  aar-conf:
    content: |
      listener 1883 0.0.0.0
      allow_anonymous true
      acl_file /mosquitto/config/airport.acl
      persistence true
      persistence_location /mosquitto/data/
      connection regional-AAR
      address regional:1883
      local_clientid bridge-AAR
      remote_clientid bridge-AAR
      try_private false
      notifications false
      cleansession false
      restart_timeout 1 30
      topic airport/AAR/# out 1
      log_dest stdout
  aar-acl:
    content: |
      topic read airport/AAR/#
      topic write airport/AAR/#
      topic read $$SYS/#
  cph-conf:
    content: |
      listener 1883 0.0.0.0
      allow_anonymous true
      acl_file /mosquitto/config/airport.acl
      persistence true
      persistence_location /mosquitto/data/
      connection regional-CPH
      address regional:1883
      local_clientid bridge-CPH
      remote_clientid bridge-CPH
      try_private false
      notifications false
      cleansession false
      restart_timeout 1 30
      topic airport/CPH/# out 1
      log_dest stdout
  cph-acl:
    content: |
      topic read airport/CPH/#
      topic write airport/CPH/#
      topic read $$SYS/#
