services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luggage
      POSTGRES_USER: luggage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luggage -d luggage"]
      interval: 5s
      timeout: 3s
      retries: 20
  regional:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/regional.conf"]
    volumes: ["./docker/mosquitto/regional.conf:/mosquitto/config/regional.conf:ro", "./docker/mosquitto/regional.acl:/mosquitto/config/regional.acl:ro", "regional-data:/mosquitto/data"]
    networks: [airport-brokers]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 20
  aar:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes: ["./docker/mosquitto/aar.conf:/mosquitto/config/mosquitto.conf:ro", "./docker/mosquitto/aar.acl:/mosquitto/config/airport.acl:ro", "aar-data:/mosquitto/data"]
    networks: [airport-brokers]
    depends_on: [regional]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 20
  cph:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes: ["./docker/mosquitto/cph.conf:/mosquitto/config/mosquitto.conf:ro", "./docker/mosquitto/cph.acl:/mosquitto/config/airport.acl:ro", "cph-data:/mosquitto/data"]
    networks: [airport-brokers]
    depends_on: [regional]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 20
  backend:
    image: andreasfrost1004/luggagetracker-backend:latest
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=luggage;Username=luggage;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Mqtt__Host: regional
      Mqtt__Region: EU
      Rules__LoadingCutoffSeconds: 20
      Rules__GraceSeconds: 5
      Rules__StaleSeconds: 30
      AirportSimulation__Url: http://airport-simulation:8080
      Brokers__ConfigPath: /broker-config
      Docker__Endpoint: unix:///var/run/docker.sock
    volumes: ["airport-broker-config:/broker-config", "simulation-runs:/runs", "/var/run/docker.sock:/var/run/docker.sock"]
    networks: [default, airport-brokers]
    depends_on:
      postgres: {condition: service_healthy}
      regional: {condition: service_healthy}
      aar: {condition: service_healthy}
      cph: {condition: service_healthy}
      airport-simulation: {condition: service_started}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  airport-simulation:
    image: andreasfrost1004/luggagetracker-airport-simulation:latest
    build: {context: ., dockerfile: airport-simulation/Dockerfile}
    restart: unless-stopped
    environment:
      BackendUrl: http://backend:8080
      DeviceSimulatorUrl: http://iot-device-simulator:8080/publish
      ScenariosDirectory: /app/scenarios
    volumes: ["simulation-runs:/runs"]
    networks: [default, airport-brokers]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  iot-device-simulator:
    image: andreasfrost1004/luggagetracker-iot-device-simulator:latest
    build: {context: ., dockerfile: iot-device-simulator/Dockerfile}
    restart: unless-stopped
    networks: [default, airport-brokers]
    labels:
      com.centurylinklabs.watchtower.enable: "true"
  frontend:
    image: andreasfrost1004/luggagetracker-frontend:latest
    build: ./frontend
    restart: unless-stopped
    networks: [default, ingress]
    depends_on:
      backend: {condition: service_healthy}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
networks:
  ingress:
    external: true
  airport-brokers:
    name: airport-brokers
    internal: true
volumes:
  postgres-data:
  regional-data:
  aar-data:
  cph-data:
  simulation-runs:
  airport-broker-config:
    name: airport-broker-config
